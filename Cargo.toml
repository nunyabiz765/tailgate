[package]
name = "tailgate"
version = "0.2.2"
edition = "2021"
description = "A native desktop app for Tailscale and its Mullvad exit nodes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nunyabiz765/tailgate"
publish = false

[lib]
name = "tailgate"
path = "src/lib.rs"

[[bin]]
name = "tailgate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
